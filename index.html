<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三字经识字游戏</title>
    <style>
        :root {
            --primary: #FF9800;
            --secondary: #4FC3F7;
            --accent: #FFEB3B;
            --bg-start: #E3F2FD;
            --bg-end: #BBDEFB;
            --text-dark: #2C3E50;
            --success: #8BC34A;
            --error: #F44336;
            --card-bg: #FFFFFF;
            --shadow: rgba(0,0,0,0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            min-height: 100vh;
            color: var(--text-dark);
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 15px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 头部样式 */
        .header {
            text-align: center;
            padding: 10px 0;
            flex-shrink: 0;
        }
        
        .game-title {
            font-size: 2em;
            color: var(--primary);
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px var(--shadow);
        }
        
        .progress-info {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 8px 20px;
            display: inline-block;
            font-size: 1.1em;
            color: var(--text-dark);
            box-shadow: 0 2px 10px var(--shadow);
        }
        
        /* 导航页 */
        .nav-page {
            display: block;
            flex: 1;
            overflow-y: auto;
        }
        
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            padding: 20px 0;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .level-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px var(--shadow);
            position: relative;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .level-card:hover:not(.locked) {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px var(--shadow);
        }
        
        .level-card.locked {
            background: #F5F5F5;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .level-card.passed {
            background: linear-gradient(135deg, var(--success), #C8E6C9);
            color: white;
        }
        
        .level-number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .level-status {
            font-size: 1.5em;
        }
        
        /* 测试页 */
        .test-page {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
        }
        
        .test-header {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 2px 8px var(--shadow);
            flex-shrink: 0;
        }
        
        .test-info {
            display: flex;
            gap: 20px;
            font-size: 1.1em;
            align-items: center;
        }
        
        .char-display {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            margin: 15px 0;
            box-shadow: 0 4px 15px var(--shadow);
            flex-shrink: 0;
        }
        
        .current-char {
            font-size: 6rem;
            font-weight: bold;
            color: var(--text-dark);
            line-height: 1;
        }
        
        .question-timer {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 12px 20px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px var(--shadow);
            flex-shrink: 0;
        }
        
        .timer-bar {
            background: #E0E0E0;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin-top: 8px;
            position: relative;
        }
        
        .timer-bar-fill {
            background: linear-gradient(90deg, var(--success), var(--secondary));
            height: 100%;
            transition: width 1s linear;
            border-radius: 10px;
        }
        
        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            color: var(--text-dark);
            font-size: 0.9em;
        }
        
        /* 选项布局 - 一行五列压缩版 */
        .options-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 10px 0;
            flex-shrink: 0;
        }
        
        .option-btn {
            background: linear-gradient(135deg, var(--accent), #FFF176);
            border: none;
            border-radius: 12px;
            padding: 12px 8px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 3px 8px var(--shadow);
            text-align: center;
            min-width: 90px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }
        
        .option-btn.correct {
            background: linear-gradient(135deg, var(--success), #AED581);
            color: white;
        }
        
        .option-btn.wrong {
            background: linear-gradient(135deg, var(--error), #EF5350);
            color: white;
        }
        
        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.8;
        }
        
        .option-label {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 0.5em;
            opacity: 0.7;
        }
        
        .option-e {
            min-width: 120px;
        }
        
        /* 统计区域 */
        .stats-area {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 2px 8px var(--shadow);
            flex-shrink: 0;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--primary);
        }
        
        .stat-label {
            font-size: 0.9em;
            color: var(--text-dark);
            opacity: 0.8;
        }
        
        /* 结果页 */
        .result-page {
            display: none;
            text-align: center;
            flex: 1;
            overflow-y: auto;
        }
        
        .result-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            margin: 20px auto;
            max-width: 500px;
            box-shadow: 0 4px 15px var(--shadow);
        }
        
        .result-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }
        
        .result-title {
            font-size: 2em;
            margin-bottom: 20px;
            color: var(--text-dark);
        }
        
        .result-stats {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .result-stat {
            text-align: center;
        }
        
        .result-stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--primary);
        }
        
        .result-stat-label {
            font-size: 1em;
            color: var(--text-dark);
            opacity: 0.8;
        }
        
        .wrong-words {
            background: #F5F5F5;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        
        .wrong-word-item {
            display: inline-block;
            background: var(--card-bg);
            border-radius: 10px;
            padding: 8px 12px;
            margin: 5px;
            box-shadow: 0 1px 5px var(--shadow);
            font-size: 1.1em;
        }
        
        /* 按钮样式 */
        .btn {
            background: linear-gradient(135deg, var(--primary), #FFB74D);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            box-shadow: 0 4px 12px rgba(255,152,0,0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255,152,0,0.4);
        }
        
        .btn-small {
            padding: 8px 20px;
            font-size: 1em;
        }
        
        /* 反馈区域 */
        .feedback-area {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px 15px;
            margin: 10px 0;
            text-align: center;
            font-size: 1.2em;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px var(--shadow);
            flex-shrink: 0;
        }
        
        .hidden {
            display: none !important;
        }
        
        /* 响应式调整 */
        @media (max-width: 1200px) {
            .levels-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        @media (max-width: 900px) {
            .levels-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .option-btn {
                min-width: 80px;
                font-size: 1em;
                height: 45px;
            }
            .current-char {
                font-size: 4rem;
            }
        }
        
        @media (max-width: 600px) {
            .levels-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 导航页 -->
        <div id="navPage" class="nav-page">
            <div class="header">
                <h1 class="game-title">🎮 三字经识字游戏</h1>
                <div class="progress-info">
                    🌟 已通过 <span id="passedCount">0</span> / 10 关 🌟
                </div>
            </div>
            
            <div class="levels-grid" id="levelsGrid">
                <!-- 关卡卡片将由JavaScript生成 -->
            </div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn btn-small" onclick="resetProgress()">🔄 重新开始</button>
            </div>
        </div>
        
        <!-- 测试页 -->
        <div id="testPage" class="test-page">
            <div class="test-header">
                <div class="test-info">
                    <div>📍 第 <span id="currentLevel">1</span> 关</div>
                    <div>⏱️ <span id="totalTimer">00:00</span></div>
                    <div>📝 <span id="currentQuestion">1</span>/<span id="totalQuestions">50</span></div>
                </div>
                <button class="btn btn-small" onclick="exitTest()">退出</button>
            </div>
            
            <div class="char-display">
                <div class="current-char" id="currentChar">人</div>
            </div>
            
            <div class="question-timer">
                <div>⏰ <span id="questionTimer">15</span> 秒</div>
                <div class="timer-bar">
                    <div class="timer-bar-fill" id="timerBarFill" style="width: 100%"></div>
                    <div class="timer-text" id="timerText">15</div>
                </div>
            </div>
            
            <div class="feedback-area" id="feedbackArea"></div>
            
            <div class="options-container" id="optionsContainer"></div>
            
            <div class="stats-area">
                <div class="stat-item">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">✅</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="wrongCount">0</div>
                    <div class="stat-label">❌</div>
                </div>
            </div>
        </div>
        
        <!-- 结果页 -->
        <div id="resultPage" class="result-page">
            <div class="header">
                <h1 class="game-title">🎯 结果</h1>
            </div>
            <div class="result-card">
                <div class="result-icon" id="resultIcon">🎉</div>
                <div class="result-title" id="resultTitle">恭喜过关！</div>
                
                <div class="result-stats">
                    <div class="result-stat">
                        <div class="result-stat-value" id="resultCorrect">0</div>
                        <div class="result-stat-label">正确</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value" id="resultWrong">0</div>
                        <div class="result-stat-label">错误</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value" id="resultTime">00:00</div>
                        <div class="result-stat-label">用时</div>
                    </div>
                </div>
                
                <div id="wrongWordsArea" class="wrong-words hidden">
                    <h3>📝 错题回顾</h3>
                    <div id="wrongWordsList"></div>
                </div>
                
                <div style="margin-top: 25px;">
                    <button class="btn" id="nextLevelBtn" onclick="goToNextLevel()">下一关</button>
                    <button class="btn btn-small" onclick="goToNav()">返回首页</button>
                </div>
            </div>
        </div>
    </div>

        let allChars = [];
        let levels = [];
        let currentLevel = 1;
        let currentChars = [];
        let currentIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let wrongWords = [];
        let totalStartTime = null;
        let questionTimer = null;
        let totalTimer = null;
        let passedLevels = [];
        let unlockedLevels = [1];

        function init() {
            const charSet = new Set();
            const text = sanzijingText.replace(/\s+/g, '');
            for (const char of text) {
                if (char.trim()) charSet.add(char);
            }
            allChars = Array.from(charSet).map(char => ({
                char: char,
                pinyin: pinyinData[char] || 'N/A',
                strokes: 10
            }));
            
            allChars.sort((a, b) => a.strokes - b.strokes);
            const levelSize = Math.ceil(allChars.length / 10);
            levels = [];
            for (let i = 0; i < 10; i++) {
                const start = i * levelSize;
                const end = Math.min(start + levelSize, allChars.length);
                levels.push(allChars.slice(start, end));
            }
            
            loadProgress();
            renderNavPage();
        }

        function saveProgress() {
            const data = { passedLevels, unlockedLevels };
            localStorage.setItem('sanzijing_progress', JSON.stringify(data));
        }

        function loadProgress() {
            try {
                const data = localStorage.getItem('sanzijing_progress');
                if (data) {
                    const parsed = JSON.parse(data);
                    passedLevels = parsed.passedLevels || [];
                    unlockedLevels = parsed.unlockedLevels || [1];
                }
            } catch (e) {
                console.error('加载进度失败', e);
            }
        }

        function resetProgress() {
            if (confirm('确定要重新开始吗？')) {
                passedLevels = [];
                unlockedLevels = [1];
                saveProgress();
                renderNavPage();
            }
        }

        function renderNavPage() {
            document.getElementById('passedCount').textContent = passedLevels.length;
            const grid = document.getElementById('levelsGrid');
            grid.innerHTML = '';
            
            for (let i = 1; i <= 10; i++) {
                const isUnlocked = unlockedLevels.includes(i);
                const isPassed = passedLevels.includes(i);
                
                const card = document.createElement('div');
                card.className = 'level-card' + (isUnlocked ? '' : ' locked') + (isPassed ? ' passed' : '');
                card.innerHTML = `
                    <div class="level-number">${i}</div>
                    <div class="level-status">${isPassed ? '✅' : (isUnlocked ? '🔓' : '🔒')}</div>
                `;
                
                if (isUnlocked) {
                    card.onclick = () => startTest(i);
                }
                
                grid.appendChild(card);
            }
        }

        function startTest(level) {
            currentLevel = level;
            currentChars = [...levels[level - 1]];
            shuffleArray(currentChars);
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            wrongWords = [];
            
            showPage('test');
            totalStartTime = Date.now();
            updateTotalTimer();
            totalTimer = setInterval(updateTotalTimer, 1000);
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex >= currentChars.length || wrongCount > 2) {
                endTest();
                return;
            }
            
            const current = currentChars[currentIndex];
            document.getElementById('currentChar').textContent = current.char;
            document.getElementById('currentLevel').textContent = currentLevel;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
            document.getElementById('currentQuestion').textContent = currentIndex + 1;
            document.getElementById('totalQuestions').textContent = currentChars.length;
            document.getElementById('feedbackArea').innerHTML = '';
            
            generateOptions(current);
            startQuestionTimer();
        }

        function generateOptions(current) {
            const correctPinyin = current.pinyin;
            const options = [correctPinyin];
            
            const allPinyins = Object.values(pinyinData);
            while (options.length < 4) {
                const randomPinyin = allPinyins[Math.floor(Math.random() * allPinyins.length)];
                if (!options.includes(randomPinyin)) options.push(randomPinyin);
            }
            shuffleArray(options);
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D', 'E'];
            const optionTexts = [...options.slice(0, 4), '不认识'];
            
            optionTexts.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn' + (index === 4 ? ' option-e' : '');
                btn.innerHTML = `<span class="option-label">${labels[index]}</span>${opt}`;
                btn.onclick = () => checkAnswer(opt === '不认识' ? 'UNKNOWN' : opt, correctPinyin, current.char, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, char, btn) {
            stopQuestionTimer();
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.classList.add('disabled'));
            
            const feedbackArea = document.getElementById('feedbackArea');
            if (selected === correct) {
                correctCount++;
                btn.classList.add('correct');
                feedbackArea.innerHTML = '<span style="color:var(--success)">✓ 正确！</span>';
                setTimeout(() => {
                    currentIndex++;
                    showQuestion();
                }, 800);
            } else {
                wrongCount++;
                btn.classList.add('wrong');
                wrongWords.push({ char, pinyin: correct });
                feedbackArea.innerHTML = `<span style="color:var(--error)">✗ 错了！${char}(${correct})</span>`;
                
                if (wrongCount > 2) {
                    setTimeout(() => endTest(), 1500);
                } else {
                    setTimeout(() => {
                        currentIndex++;
                        showQuestion();
                    }, 1500);
                }
            }
            
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
        }

        function updateTotalTimer() {
            const elapsed = Math.floor((Date.now() - totalStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('totalTimer').textContent = `${minutes}:${seconds}`;
        }

        function startQuestionTimer() {
            let remaining = 15;
            document.getElementById('questionTimer').textContent = remaining;
            document.getElementById('timerText').textContent = remaining;
            const fill = document.getElementById('timerBarFill');
            fill.style.width = '100%';
            
            questionStartTime = Date.now();
            questionTimer = setInterval(() => {
                const elapsed = Math.floor((Date.now() - questionStartTime) / 1000);
                remaining = Math.max(0, 15 - elapsed);
                document.getElementById('questionTimer').textContent = remaining;
                document.getElementById('timerText').textContent = remaining;
                const percent = (remaining / 15) * 100;
                fill.style.width = percent + '%';
                
                if (remaining <= 0) {
                    stopQuestionTimer();
                    handleTimeout();
                }
            }, 100);
        }

        function stopQuestionTimer() {
            if (questionTimer) {
                clearInterval(questionTimer);
                questionTimer = null;
            }
        }

        function handleTimeout() {
            const current = currentChars[currentIndex];
            wrongCount++;
            wrongWords.push({ char: current.char, pinyin: current.pinyin });
            document.getElementById('feedbackArea').innerHTML = 
                `<span style="color:var(--error)">⏰ 超时！${current.char}(${current.pinyin})</span>`;
            document.getElementById('wrongCount').textContent = wrongCount;
            
            setTimeout(() => {
                if (wrongCount > 2) endTest();
                else {
                    currentIndex++;
                    showQuestion();
                }
            }, 1500);
        }

        function endTest() {
            stopQuestionTimer();
            if (totalTimer) clearInterval(totalTimer);
            
            const elapsed = Math.floor((Date.now() - totalStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            
            const passed = wrongCount <= 2;
            if (passed && !passedLevels.includes(currentLevel)) {
                passedLevels.push(currentLevel);
                if (currentLevel < 10 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }
                saveProgress();
            }
            
            showPage('result');
            document.getElementById('resultCorrect').textContent = correctCount;
            document.getElementById('resultWrong').textContent = wrongCount;
            document.getElementById('resultTime').textContent = `${minutes}:${seconds}`;
            
            const resultIcon = document.getElementById('resultIcon');
            const resultTitle = document.getElementById('resultTitle');
            const nextLevelBtn = document.getElementById('nextLevelBtn');
            
            if (passed) {
                resultIcon.textContent = '🎉';
                resultTitle.textContent = currentLevel === 10 ? '🏆 通关！' : '🎉 过关！';
                nextLevelBtn.style.display = currentLevel < 10 ? 'inline-block' : 'none';
            } else {
                resultIcon.textContent = '😢';
                resultTitle.textContent = '再接再厉！';
                nextLevelBtn.style.display = 'none';
            }
            
            const wrongWordsArea = document.getElementById('wrongWordsArea');
            const wrongWordsList = document.getElementById('wrongWordsList');
            if (wrongWords.length > 0) {
                wrongWordsArea.classList.remove('hidden');
                wrongWordsList.innerHTML = wrongWords.map(w => 
                    `<span class="wrong-word-item">${w.char}<span style="color:var(--primary)">(${w.pinyin})</span></span>`
                ).join('');
            } else {
                wrongWordsArea.classList.add('hidden');
            }
        }

        function goToNextLevel() {
            if (currentLevel < 10) startTest(currentLevel + 1);
            else goToNav();
        }

        function goToNav() {
            showPage('nav');
            renderNavPage();
        }

        function exitTest() {
            if (confirm('确定退出测试吗？')) {
                stopQuestionTimer();
                if (totalTimer) clearInterval(totalTimer);
                goToNav();
            }
        }

        function showPage(page) {
            document.getElementById('navPage').style.display = page === 'nav' ? 'block' : 'none';
            document.getElementById('testPage').style.display = page === 'test' ? 'flex' : 'none';
            document.getElementById('resultPage').style.display = page === 'result' ? 'block' : 'none';
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
