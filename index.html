<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三字经识字游戏</title>
    <style>
        /* ========== 设计系统 ========== */
        :root {
            --color-primary: #5B8DEF;
            --color-primary-light: #7BA4F7;
            --color-primary-bg: #EEF3FF;
            --color-accent: #FFD166;
            --color-success: #06D6A0;
            --color-error: #EF476F;
            --color-text: #2D3748;
            --color-text-secondary: #718096;
            --color-text-light: #A0AEC0;
            --color-bg: #F7F8FC;
            --color-card: #FFFFFF;
            --color-border: #E2E8F0;
            --color-option-hover: #F0F4FF;
            --color-option-e: #F7FAFC;
            --color-option-e-border: #CBD5E0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --font-main: -apple-system, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
            --content-width: 960px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== 主容器 ========== */
        .app {
            width: 100%;
            max-width: var(--content-width);
            min-height: 100vh;
            padding: 32px 40px;
        }

        /* ========== 导航页 ========== */
        .nav-page { display: block; }

        .nav-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .nav-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--color-text);
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .nav-progress {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--color-card);
            padding: 8px 20px;
            border-radius: 100px;
            font-size: 14px;
            color: var(--color-text-secondary);
            box-shadow: var(--shadow-sm);
        }

        .nav-progress strong {
            color: var(--color-primary);
            font-weight: 600;
        }

        /* 关卡网格 */
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 40px;
        }

        .level-card {
            background: var(--color-card);
            border-radius: var(--radius-lg);
            padding: 28px 12px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-sm);
            border: 2px solid transparent;
            position: relative;
        }

        .level-card:hover:not(.locked) {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .level-card.locked {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .level-card.locked:hover {
            transform: none;
        }

        .level-card.unlocked {
            border-color: var(--color-border);
        }

        .level-card.unlocked:hover {
            border-color: var(--color-primary-light);
        }

        .level-card.current {
            border-color: var(--color-primary);
            background: var(--color-primary-bg);
        }

        .level-card.passed {
            border-color: var(--color-success);
            background: #F0FFF8;
        }

        .level-num {
            font-size: 32px;
            font-weight: 700;
            color: var(--color-primary);
            line-height: 1;
            margin-bottom: 8px;
        }

        .level-card.locked .level-num {
            color: var(--color-text-light);
        }

        .level-card.passed .level-num {
            color: var(--color-success);
        }

        .level-name {
            font-size: 13px;
            color: var(--color-text-secondary);
            margin-bottom: 8px;
        }

        .level-card.locked .level-name {
            color: var(--color-text-light);
        }

        .level-check {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 22px;
            height: 22px;
            background: var(--color-success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }

        .level-lock {
            font-size: 13px;
            color: var(--color-text-light);
            margin-top: 4px;
        }

        .level-char-count {
            font-size: 11px;
            color: var(--color-text-light);
            margin-top: 6px;
        }

        .nav-footer {
            text-align: center;
        }

        .btn-reset {
            background: none;
            border: 1px solid var(--color-border);
            border-radius: 100px;
            padding: 8px 24px;
            font-size: 13px;
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-main);
        }

        .btn-reset:hover {
            border-color: var(--color-error);
            color: var(--color-error);
        }

        /* ========== 测试页 ========== */
        .test-page {
            display: none;
            flex-direction: column;
            height: 100vh;
            padding: 24px 40px;
            max-width: var(--content-width);
            margin: 0 auto;
        }

        .test-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .test-level {
            font-size: 15px;
            font-weight: 600;
            color: var(--color-text-secondary);
        }

        .test-level span {
            color: var(--color-primary);
        }

        .test-timer {
            font-size: 14px;
            color: var(--color-text-secondary);
            font-variant-numeric: tabular-nums;
        }

        .test-progress {
            font-size: 14px;
            color: var(--color-text-light);
        }

        .btn-exit {
            background: none;
            border: 1px solid var(--color-border);
            border-radius: 100px;
            padding: 6px 16px;
            font-size: 13px;
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-main);
        }

        .btn-exit:hover {
            border-color: var(--color-text-secondary);
        }

        /* 汉字显示 */
        .char-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .char-display {
            background: var(--color-card);
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 360px;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
            margin-bottom: 16px;
            position: relative;
        }

        .char-display .char {
            font-size: 120px;
            font-weight: 700;
            color: var(--color-text);
            line-height: 1;
        }

        /* 倒计时 */
        .timer-section {
            width: 100%;
            max-width: 360px;
            margin-bottom: 20px;
        }

        .timer-bar-bg {
            width: 100%;
            height: 6px;
            background: var(--color-border);
            border-radius: 100px;
            overflow: hidden;
        }

        .timer-bar-fill {
            height: 100%;
            background: var(--color-primary);
            border-radius: 100px;
            transition: width 1s linear;
        }

        .timer-bar-fill.warning {
            background: var(--color-accent);
        }

        .timer-bar-fill.danger {
            background: var(--color-error);
        }

        /* 选项区 */
        .options-section {
            width: 100%;
            margin-bottom: 16px;
        }

        .options-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .options-row:last-child {
            margin-bottom: 0;
        }

        .option-btn {
            background: var(--color-card);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 0 24px;
            height: 64px;
            min-width: 148px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-main);
            font-size: 18px;
            color: var(--color-text);
        }

        .option-btn:hover:not(.disabled) {
            border-color: var(--color-primary-light);
            background: var(--color-option-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .option-btn:active:not(.disabled) {
            transform: translateY(0);
        }

        .option-btn .label {
            font-size: 13px;
            font-weight: 600;
            color: var(--color-text-light);
            min-width: 16px;
        }

        .option-btn .text {
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* E选项差异化 */
        .option-btn.opt-e {
            border-style: dashed;
            border-color: var(--color-option-e-border);
            background: var(--color-option-e);
            color: var(--color-text-secondary);
            font-size: 15px;
            min-width: 148px;
            justify-content: center;
        }

        .option-btn.opt-e:hover:not(.disabled) {
            border-color: var(--color-text-secondary);
            background: #EDF2F7;
        }

        /* 选项状态 */
        .option-btn.correct {
            border-color: var(--color-success);
            background: #F0FFF8;
            color: var(--color-success);
        }

        .option-btn.wrong {
            border-color: var(--color-error);
            background: #FFF5F7;
            color: var(--color-error);
        }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        /* 反馈 */
        .feedback {
            text-align: center;
            font-size: 15px;
            font-weight: 500;
            height: 28px;
            line-height: 28px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .feedback.correct {
            color: var(--color-success);
        }

        .feedback.wrong {
            color: var(--color-error);
        }

        /* 统计 */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 12px 0;
            flex-shrink: 0;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-text);
        }

        .stat-label {
            font-size: 12px;
            color: var(--color-text-light);
            margin-top: 2px;
        }

        .stat-value.success { color: var(--color-success); }
        .stat-value.error { color: var(--color-error); }

        /* ========== 结果页 ========== */
        .result-page {
            display: none;
            text-align: center;
            padding-top: 60px;
        }

        .result-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .result-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 32px;
        }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin-bottom: 36px;
        }

        .result-stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--color-primary);
        }

        .result-stat-label {
            font-size: 13px;
            color: var(--color-text-secondary);
            margin-top: 4px;
        }

        .wrong-section {
            background: var(--color-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin: 0 auto 32px;
            max-width: 500px;
            text-align: left;
            box-shadow: var(--shadow-sm);
        }

        .wrong-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-secondary);
            margin-bottom: 12px;
        }

        .wrong-item {
            display: inline-block;
            padding: 6px 14px;
            margin: 4px;
            background: var(--color-bg);
            border-radius: var(--radius-sm);
            font-size: 15px;
        }

        .wrong-item .pinyin {
            color: var(--color-primary);
            margin-left: 4px;
            font-size: 13px;
        }

        .result-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn-primary {
            background: var(--color-primary);
            border: none;
            border-radius: 100px;
            padding: 12px 36px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-main);
        }

        .btn-primary:hover {
            background: var(--color-primary-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(91,141,239,0.3);
        }

        .btn-secondary {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: 100px;
            padding: 12px 36px;
            font-size: 15px;
            font-weight: 500;
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-main);
        }

        .btn-secondary:hover {
            border-color: var(--color-text-secondary);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app">
        <!-- 导航页 -->
        <div id="navPage" class="nav-page">
            <div class="nav-header">
                <h1 class="nav-title">三字经识字游戏</h1>
                <div class="nav-progress">
                    已完成 <strong id="passedCount">0</strong> / 10 关
                </div>
            </div>
            <div class="levels-grid" id="levelsGrid"></div>
            <div class="nav-footer">
                <button class="btn-reset" onclick="resetProgress()">重新开始</button>
            </div>
        </div>

        <!-- 测试页 -->
        <div id="testPage" class="test-page">
            <div class="test-top">
                <div class="test-level">第 <span id="currentLevel">1</span> 关</div>
                <div class="test-progress" id="currentQuestion">1 / 50</div>
                <div class="test-timer" id="totalTimer">00:00</div>
                <button class="btn-exit" onclick="exitTest()">退出</button>
            </div>

            <div class="char-section">
                <div class="char-display">
                    <span class="char" id="currentChar">人</span>
                </div>

                <div class="timer-section">
                    <div class="timer-bar-bg">
                        <div class="timer-bar-fill" id="timerBarFill" style="width:100%"></div>
                    </div>
                </div>

                <div class="feedback" id="feedback"></div>

                <div class="options-section">
                    <div class="options-row" id="optionsRow1"></div>
                    <div class="options-row" id="optionsRow2"></div>
                </div>
            </div>

            <div class="stats-bar">
                <div class="stat">
                    <div class="stat-value success" id="correctCount">0</div>
                    <div class="stat-label">正确</div>
                </div>
                <div class="stat">
                    <div class="stat-value error" id="wrongCount">0</div>
                    <div class="stat-label">错误</div>
                </div>
            </div>
        </div>

        <!-- 结果页 -->
        <div id="resultPage" class="result-page">
            <div class="result-icon" id="resultIcon">🎉</div>
            <div class="result-title" id="resultTitle">恭喜过关！</div>
            <div class="result-stats">
                <div>
                    <div class="result-stat-value" id="resultCorrect">0</div>
                    <div class="result-stat-label">正确</div>
                </div>
                <div>
                    <div class="result-stat-value" id="resultWrong">0</div>
                    <div class="result-stat-label">错误</div>
                </div>
                <div>
                    <div class="result-stat-value" id="resultTime">00:00</div>
                    <div class="result-stat-label">用时</div>
                </div>
            </div>
            <div id="wrongWordsArea" class="wrong-section hidden">
                <h3>错题回顾</h3>
                <div id="wrongWordsList"></div>
            </div>
            <div class="result-buttons">
                <button class="btn-primary" id="nextLevelBtn" onclick="goToNextLevel()">下一关</button>
                <button class="btn-secondary" onclick="goToNav()">返回首页</button>
            </div>
        </div>
    </div>

    <script>

        const levelNames = ['入门','基础','进阶','提高','突破','挑战','精进','高手','大师','巅峰'];

        let currentIndex = 0, correctCount = 0, wrongCount = 0, wrongWords = [];
        let totalStartTime = null, questionTimer = null, totalTimer = null;
        let passedLevels = [], unlockedLevels = [1];

        function init() {
            const charSet = new Set();
            for (const c of sanzijingText.replace(/\s+/g, '')) {
                if (c.trim()) charSet.add(c);
            }
            allChars = [...charSet].map(c => ({ char: c, pinyin: pinyinData[c] || '' }));
            const n = Math.ceil(allChars.length / 10);
            levels = [];
            for (let i = 0; i < 10; i++) levels.push(allChars.slice(i*n, (i+1)*n));
            loadProgress();
            renderNav();
        }

        function save() { localStorage.setItem('szj', JSON.stringify({passedLevels, unlockedLevels})); }
        function loadProgress() {
            try {
                const d = JSON.parse(localStorage.getItem('szj') || '{}');
                passedLevels = d.passedLevels || [];
                unlockedLevels = d.unlockedLevels || [1];
            } catch(e) {}
        }
        function resetProgress() {
            if (confirm('确定重新开始？所有进度将清空。')) {
                passedLevels = []; unlockedLevels = [1]; save(); renderNav();
            }
        }

        function renderNav() {
            document.getElementById('passedCount').textContent = passedLevels.length;
            const g = document.getElementById('levelsGrid');
            g.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const unlocked = unlockedLevels.includes(i);
                const passed = passedLevels.includes(i);
                const isCurrent = unlocked && !passed;
                const card = document.createElement('div');
                card.className = 'level-card' + (passed ? ' passed' : (unlocked ? (isCurrent ? ' current' : ' unlocked') : ' locked'));
                card.innerHTML = `
                    ${passed ? '<div class="level-check">✓</div>' : ''}
                    <div class="level-num">${i}</div>
                    <div class="level-name">${levelNames[i-1]}</div>
                    <div class="level-char-count">${levels[i-1].length} 字</div>
                    ${!unlocked ? '<div class="level-lock">未解锁</div>' : ''}
                `;
                if (unlocked) card.onclick = () => startTest(i);
                g.appendChild(card);
            }
        }

        function startTest(level) {
            currentLevel = level;
            currentChars = shuffle([...levels[level-1]]);
            currentIndex = 0; correctCount = 0; wrongCount = 0; wrongWords = [];
            showPage('test');
            totalStartTime = Date.now();
            totalTimer = setInterval(tickTotal, 1000);
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex >= currentChars.length || wrongCount > 2) { endTest(); return; }
            const cur = currentChars[currentIndex];
            document.getElementById('currentChar').textContent = cur.char;
            document.getElementById('currentLevel').textContent = currentLevel;
            document.getElementById('currentQuestion').textContent = `${currentIndex+1} / ${currentChars.length}`;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            buildOptions(cur);
            startQTimer();
        }

        function buildOptions(cur) {
            const correct = cur.pinyin;
            const opts = [correct];
            const all = [...new Set(Object.values(pinyinData))];
            while (opts.length < 4) {
                const r = all[Math.floor(Math.random()*all.length)];
                if (!opts.includes(r)) opts.push(r);
            }
            shuffle(opts);
            const row1 = document.getElementById('optionsRow1');
            const row2 = document.getElementById('optionsRow2');
            row1.innerHTML = ''; row2.innerHTML = '';
            const labels = ['A','B','C','D'];
            opts.forEach((o,i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="label">${labels[i]}</span><span class="text">${o}</span>`;
                btn.onclick = () => answer(o, correct, cur.char, btn);
                row1.appendChild(btn);
            });
            const btnE = document.createElement('button');
            btnE.className = 'option-btn opt-e';
            btnE.innerHTML = '<span class="label">E</span><span class="text">不认识</span>';
            btnE.onclick = () => answer('SKIP', correct, cur.char, btnE);
            row2.appendChild(btnE);
        }

        function answer(sel, correct, char, btn) {
            stopQTimer();
            document.querySelectorAll('.option-btn').forEach(b => b.classList.add('disabled'));
            const fb = document.getElementById('feedback');
            if (sel === correct) {
                correctCount++;
                btn.classList.add('correct');
                fb.textContent = '正确';
                fb.className = 'feedback correct';
                setTimeout(next, 600);
            } else {
                wrongCount++;
                btn.classList.add('wrong');
                wrongWords.push({char, pinyin: correct});
                fb.textContent = sel === 'SKIP' ? `答案是 ${char}（${correct}）` : `错误，${char}（${correct}）`;
                fb.className = 'feedback wrong';
                setTimeout(wrongCount > 2 ? endTest : next, 1500);
            }
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
        }

        function next() { currentIndex++; showQuestion(); }

        function tickTotal() {
            const s = Math.floor((Date.now()-totalStartTime)/1000);
            document.getElementById('totalTimer').textContent =
                `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
        }

        function startQTimer() {
            let rem = 15;
            const fill = document.getElementById('timerBarFill');
            fill.style.width = '100%';
            fill.className = 'timer-bar-fill';
            const start = Date.now();
            questionTimer = setInterval(() => {
                rem = Math.max(0, 15 - Math.floor((Date.now()-start)/1000));
                fill.style.width = (rem/15*100)+'%';
                fill.className = 'timer-bar-fill' + (rem <= 5 ? ' danger' : rem <= 10 ? ' warning' : '');
                if (rem <= 0) { stopQTimer(); timeout(); }
            }, 200);
        }
        function stopQTimer() { clearInterval(questionTimer); }

        function timeout() {
            const cur = currentChars[currentIndex];
            wrongCount++;
            wrongWords.push({char: cur.char, pinyin: cur.pinyin});
            document.getElementById('wrongCount').textContent = wrongCount;
            document.querySelectorAll('.option-btn').forEach(b => b.classList.add('disabled'));
            const fb = document.getElementById('feedback');
            fb.textContent = `时间到，${cur.char}（${cur.pinyin}）`;
            fb.className = 'feedback wrong';
            setTimeout(wrongCount > 2 ? endTest : next, 1500);
        }

        function endTest() {
            stopQTimer();
            clearInterval(totalTimer);
            const s = Math.floor((Date.now()-totalStartTime)/1000);
            const time = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
            const passed = wrongCount <= 2;
            if (passed && !passedLevels.includes(currentLevel)) {
                passedLevels.push(currentLevel);
                if (currentLevel < 10 && !unlockedLevels.includes(currentLevel+1)) unlockedLevels.push(currentLevel+1);
                save();
            }
            showPage('result');
            document.getElementById('resultCorrect').textContent = correctCount;
            document.getElementById('resultWrong').textContent = wrongCount;
            document.getElementById('resultTime').textContent = time;
            document.getElementById('resultIcon').textContent = passed ? (currentLevel===10?'🏆':'🎉') : '😊';
            document.getElementById('resultTitle').textContent = passed ? (currentLevel===10?'全部通关！':'恭喜过关！') : '再接再厉';
            document.getElementById('nextLevelBtn').style.display = (passed && currentLevel < 10) ? '' : 'none';
            const wa = document.getElementById('wrongWordsArea');
            const wl = document.getElementById('wrongWordsList');
            if (wrongWords.length) {
                wa.classList.remove('hidden');
                wl.innerHTML = wrongWords.map(w => `<span class="wrong-item">${w.char}<span class="pinyin">${w.pinyin}</span></span>`).join('');
            } else wa.classList.add('hidden');
        }

        function goToNextLevel() { if (currentLevel < 10) startTest(currentLevel+1); else goToNav(); }
        function goToNav() { showPage('nav'); renderNav(); }
        function exitTest() { if (confirm('确定退出？')) { stopQTimer(); clearInterval(totalTimer); goToNav(); } }

        function showPage(p) {
            document.getElementById('navPage').style.display = p==='nav'?'block':'none';
            document.getElementById('testPage').style.display = p==='test'?'flex':'none';
            document.getElementById('resultPage').style.display = p==='result'?'block':'none';
        }

        function shuffle(a) { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
