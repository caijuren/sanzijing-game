<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三字经识字游戏</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg-light: #F7F9FC;
            --text-dark: #2C3E50;
            --success: #6BCB77;
            --error: #FF6B6B;
            --lock: #BDC3C7;
            --card-bg: #FFFFFF;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text-dark);
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }
        
        .header {
            text-align: center;
            padding: 30px 0;
        }
        
        .header h1 {
            color: white;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }
        
        .progress-info {
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            padding: 15px 25px;
            display: inline-block;
            font-size: 1.1em;
            color: var(--text-dark);
        }
        
        /* 导航页 */
        .nav-page {
            display: block;
        }
        
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }
        
        .level-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .level-card:hover:not(.locked) {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .level-card.locked {
            background: #E0E0E0;
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .level-card.passed {
            border: 3px solid var(--success);
        }
        
        .level-card .level-num {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
        }
        
        .level-card .level-name {
            font-size: 0.9em;
            color: #666;
        }
        
        .level-card .status-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.5em;
        }
        
        .level-card .char-count {
            font-size: 0.8em;
            color: #999;
            margin-top: 8px;
        }
        
        /* 测试页 */
        .test-page {
            display: none;
        }
        
        .test-header {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .timer-display {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--primary);
        }
        
        .char-display {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            margin: 30px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .char-display .current-char {
            font-size: 8em;
            font-weight: bold;
            color: var(--text-dark);
            line-height: 1;
        }
        
        .question-timer {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 15px 25px;
            margin-bottom: 20px;
        }
        
        .timer-bar {
            background: #E0E0E0;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .timer-bar-fill {
            background: linear-gradient(90deg, var(--success), var(--secondary));
            height: 100%;
            transition: width 1s linear;
        }
        
        .timer-bar-fill.warning {
            background: linear-gradient(90deg, var(--accent), var(--primary));
        }
        
        .timer-bar-fill.danger {
            background: var(--error);
        }
        
        /* 选项 */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        
        .option-btn {
            background: var(--card-bg);
            border: none;
            border-radius: 15px;
            padding: 25px 20px;
            font-size: 1.4em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .option-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }
        
        .option-btn.correct {
            background: var(--success);
            color: white;
        }
        
        .option-btn.wrong {
            background: var(--error);
            color: white;
        }
        
        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.6;
        }
        
        .option-btn.option-e {
            grid-column: 1 / -1;
            max-width: 50%;
            margin: 0 auto;
        }
        
        .option-label {
            font-weight: bold;
            margin-right: 10px;
        }
        
        /* 反馈区域 */
        .feedback-area {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
            font-size: 1.2em;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .feedback-correct {
            color: var(--success);
        }
        
        .feedback-wrong {
            color: var(--error);
        }
        
        /* 统计区域 */
        .stats-area {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--primary);
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #666;
        }
        
        /* 结果页 */
        .result-page {
            display: none;
        }
        
        .result-card {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            margin: 30px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .result-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }
        
        .result-title {
            font-size: 2em;
            margin-bottom: 20px;
            color: var(--text-dark);
        }
        
        .result-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .result-stat {
            text-align: center;
        }
        
        .result-stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: var(--primary);
        }
        
        .result-stat-label {
            color: #666;
            margin-top: 5px;
        }
        
        /* 错题回顾 */
        .wrong-words {
            background: #F8F9FA;
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            text-align: left;
        }
        
        .wrong-words h3 {
            margin-bottom: 15px;
            color: var(--text-dark);
        }
        
        .wrong-word-item {
            display: inline-block;
            background: white;
            border-radius: 10px;
            padding: 10px 15px;
            margin: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .wrong-word-char {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--text-dark);
        }
        
        .wrong-word-pinyin {
            color: var(--primary);
            margin-left: 10px;
        }
        
        /* 按钮 */
        .btn {
            background: linear-gradient(135deg, var(--primary), #FF8E8E);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 15px 40px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(255,107,107,0.3);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255,107,107,0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary), #6EE7B7);
            box-shadow: 0 4px 15px rgba(78,205,196,0.3);
        }
        
        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(78,205,196,0.4);
        }
        
        .btn-small {
            padding: 10px 25px;
            font-size: 1em;
        }
        
        /* 响应式 */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .char-display .current-char {
                font-size: 5em;
            }
            
            .option-btn {
                padding: 20px 15px;
                font-size: 1.2em;
            }
            
            .levels-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 导航页 -->
        <div id="navPage" class="nav-page">
            <div class="header">
                <h1>🎮 三字经识字游戏</h1>
                <div class="progress-info">
                    已通过 <span id="passedCount">0</span> / 10 级
                </div>
            </div>
            <div id="levelsGrid" class="levels-grid"></div>
            <div style="text-align: center; margin-top: 30px;">
                <button class="btn btn-small btn-secondary" onclick="resetProgress()">🔄 重新开始</button>
            </div>
        </div>
        
        <!-- 测试页 -->
        <div id="testPage" class="test-page">
            <div class="test-header">
                <div>📍 第 <span id="currentLevel">1</span> 级</div>
                <div class="timer-display">⏱️ <span id="totalTimer">00:00</span></div>
                <button class="btn btn-small" onclick="exitTest()">退出测试</button>
            </div>
            
            <div class="char-display">
                <div class="current-char" id="currentChar">人</div>
            </div>
            
            <div class="question-timer">
                <div>⏰ 本题剩余时间：<span id="questionTimer">15</span> 秒</div>
                <div class="timer-bar">
                    <div class="timer-bar-fill" id="timerBarFill" style="width: 100%"></div>
                </div>
            </div>
            
            <div class="options-grid" id="optionsGrid"></div>
            
            <div class="feedback-area" id="feedbackArea"></div>
            
            <div class="stats-area">
                <div class="stat-item">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">正确</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="wrongCount">0</div>
                    <div class="stat-label">错误</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="currentQuestion">1</div>
                    <div class="stat-label">当前题</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalQuestions">50</div>
                    <div class="stat-label">总题数</div>
                </div>
            </div>
        </div>
        
        <!-- 结果页 -->
        <div id="resultPage" class="result-page">
            <div class="header">
                <h1>🎯 测试结果</h1>
            </div>
            <div class="result-card">
                <div class="result-icon" id="resultIcon">🎉</div>
                <div class="result-title" id="resultTitle">恭喜过关！</div>
                <div class="result-stats">
                    <div class="result-stat">
                        <div class="result-stat-value" id="resultCorrect">0</div>
                        <div class="result-stat-label">正确</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value" id="resultWrong">0</div>
                        <div class="result-stat-label">错误</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value" id="resultTime">00:00</div>
                        <div class="result-stat-label">用时</div>
                    </div>
                </div>
                <div id="wrongWordsArea" class="wrong-words hidden">
                    <h3>📝 错题回顾</h3>
                    <div id="wrongWordsList"></div>
                </div>
                <div style="margin-top: 30px;">
                    <button class="btn" id="nextLevelBtn" onclick="goToNextLevel()">进入下一级</button>
                    <button class="btn btn-secondary" onclick="goToNav()">返回导航</button>
                </div>
            </div>
        </div>
    </div>

        // ==================== 初始化 ====================
        function init() {
            // 提取不重复的字
            const charSet = new Set();
            const text = sanzijingText.replace(/\s+/g, '');
            for (const char of text) {
                if (char.trim()) {
                    charSet.add(char);
                }
            }
            allChars = Array.from(charSet);
            
            // 为每个字添加笔画数（默认值处理）
            allChars = allChars.map(char => ({
                char: char,
                pinyin: pinyinData[char] || 'N/A',
                strokes: strokeData[char] || 10
            }));
            
            // 按笔画数排序
            allChars.sort((a, b) => a.strokes - b.strokes);
            
            // 分成10级
            const levelSize = Math.ceil(allChars.length / 10);
            levels = [];
            for (let i = 0; i < 10; i++) {
                const start = i * levelSize;
                const end = Math.min(start + levelSize, allChars.length);
                levels.push(allChars.slice(start, end));
            }
            
            // 加载进度
            loadProgress();
            
            // 渲染导航页
            renderNavPage();
        }

            const data = {
                passedLevels: passedLevels,
                unlockedLevels: unlockedLevels
            };
            localStorage.setItem('sanzijing_progress', JSON.stringify(data));
        }

        function loadProgress() {
            try {
                const data = localStorage.getItem('sanzijing_progress');
                if (data) {
                    const parsed = JSON.parse(data);
                    passedLevels = parsed.passedLevels || [];
                    unlockedLevels = parsed.unlockedLevels || [1];
                }
            } catch (e) {
                console.error('加载进度失败', e);
            }
        }

        function resetProgress() {
            if (confirm('确定要重新开始吗？所有进度将被清空！')) {
                passedLevels = [];
                unlockedLevels = [1];
                saveProgress();
                renderNavPage();
            }
        }

        // ==================== 导航页 ====================
        function renderNavPage() {
            const grid = document.getElementById('levelsGrid');
            grid.innerHTML = '';
            
            let passedCount = 0;
            
            for (let i = 1; i <= 10; i++) {
                const isUnlocked = unlockedLevels.includes(i);
                const isPassed = passedLevels.includes(i);
                if (isPassed) passedCount++;
                
                const card = document.createElement('div');
                card.className = 'level-card';
                
                if (!isUnlocked) {
                    card.classList.add('locked');
                } else if (isPassed) {
                    card.classList.add('passed');
                }
                
                const statusIcon = isPassed ? '✅' : (isUnlocked ? '🔓' : '🔒');
                const levelName = getLevelName(i);
                const charCount = levels[i-1] ? levels[i-1].length : 0;
                
                card.innerHTML = `
                    <span class="status-icon">${statusIcon}</span>
                    <div class="level-num">第${i}级</div>
                    <div class="level-name">${levelName}</div>
                    <div class="char-count">${charCount}个字</div>
                `;
                
                if (isUnlocked) {
                    card.onclick = () => startTest(i);
                }
                
                grid.appendChild(card);
            }
            
            document.getElementById('passedCount').textContent = passedCount;
        }

        function getLevelName(level) {
            const names = [
                '入门篇', '基础篇', '进阶篇', '提高篇', '突破篇',
                '挑战篇', '精进篇', '高手篇', '大师篇', '巅峰篇'
            ];
            return names[level - 1] || '';
        }

        // ==================== 测试页 ====================
        function startTest(level) {
            currentLevel = level;
            currentChars = [...levels[level - 1]];
            shuffleArray(currentChars);
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            wrongWords = [];
            
            showPage('test');
            
            // 启动总计时
            totalStartTime = Date.now();
            updateTotalTimer();
            totalTimer = setInterval(updateTotalTimer, 1000);
            
            // 显示第一题
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex >= currentChars.length || wrongCount > 2) {
                endTest();
                return;
            }
            
            const current = currentChars[currentIndex];
            document.getElementById('currentChar').textContent = current.char;
            document.getElementById('currentLevel').textContent = currentLevel;
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
            document.getElementById('currentQuestion').textContent = currentIndex + 1;
            document.getElementById('totalQuestions').textContent = currentChars.length;
            
            // 清空反馈
            document.getElementById('feedbackArea').innerHTML = '';
            
            // 生成选项
            generateOptions(current);
            
            // 启动单题计时
            startQuestionTimer();
        }

        function generateOptions(current) {
            const correctPinyin = current.pinyin;
            const options = [correctPinyin];
            
            // 获取相似字的拼音作为干扰项
            const similar = similarChars[current.char] || [];
            for (const simChar of similar) {
                if (options.length < 4 && pinyinData[simChar] && !options.includes(pinyinData[simChar])) {
                    options.push(pinyinData[simChar]);
                }
            }
            
            // 如果不够4个，随机补充
            const allPinyins = Object.values(pinyinData);
            while (options.length < 4) {
                const randomPinyin = allPinyins[Math.floor(Math.random() * allPinyins.length)];
                if (!options.includes(randomPinyin)) {
                    options.push(randomPinyin);
                }
            }
            
            // 打乱选项顺序
            shuffleArray(options);
            
            // 渲染选项
            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            
            const labels = ['A', 'B', 'C', 'D'];
            options.forEach((pinyin, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="option-label">${labels[index]}.</span>${pinyin}`;
                btn.onclick = () => checkAnswer(pinyin, correctPinyin, current.char, btn);
                grid.appendChild(btn);
            });
            
            // 添加E选项
            const btnE = document.createElement('button');
            btnE.className = 'option-btn option-e';
            btnE.innerHTML = '<span class="option-label">E.</span>不认识';
            btnE.onclick = () => checkAnswer('UNKNOWN', correctPinyin, current.char, btnE);
            grid.appendChild(btnE);
        }

        function checkAnswer(selected, correct, char, btn) {
            // 停止单题计时
            stopQuestionTimer();
            
            // 禁用所有按钮
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.classList.add('disabled'));
            
            const feedbackArea = document.getElementById('feedbackArea');
            
            if (selected === correct) {
                // 正确
                correctCount++;
                btn.classList.add('correct');
                feedbackArea.innerHTML = '<span class="feedback-correct">✓ 正确！</span>';
                
                // 短暂延迟后下一题
                setTimeout(() => {
                    currentIndex++;
                    showQuestion();
                }, 1000);
            } else {
                // 错误
                wrongCount++;
                btn.classList.add('wrong');
                wrongWords.push({ char, pinyin: correct });
                
                feedbackArea.innerHTML = `<span class="feedback-wrong">✗ 错误！正确答案：${char} (${correct})</span>`;
                
                if (wrongCount > 2) {
                    // 超过2个错误，终止测试
                    setTimeout(() => {
                        endTest();
                    }, 2000);
                } else {
                    setTimeout(() => {
                        currentIndex++;
                        showQuestion();
                    }, 2000);
                }
            }
            
            // 更新统计
            document.getElementById('correctCount').textContent = correctCount;
            document.getElementById('wrongCount').textContent = wrongCount;
        }

        // ==================== 计时器 ====================
        function updateTotalTimer() {
            const elapsed = Math.floor((Date.now() - totalStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('totalTimer').textContent = `${minutes}:${seconds}`;
        }

        function startQuestionTimer() {
            let remaining = 15;
            document.getElementById('questionTimer').textContent = remaining;
            document.getElementById('timerBarFill').style.width = '100%';
            document.getElementById('timerBarFill').className = 'timer-bar-fill';
            
            questionStartTime = Date.now();
            
            questionTimer = setInterval(() => {
                const elapsed = Math.floor((Date.now() - questionStartTime) / 1000);
                remaining = Math.max(0, 15 - elapsed);
                
                document.getElementById('questionTimer').textContent = remaining;
                const percent = (remaining / 15) * 100;
                document.getElementById('timerBarFill').style.width = percent + '%';
                
                // 颜色变化
                const bar = document.getElementById('timerBarFill');
                if (remaining <= 5) {
                    bar.className = 'timer-bar-fill danger';
                } else if (remaining <= 10) {
                    bar.className = 'timer-bar-fill warning';
                }
                
                if (remaining <= 0) {
                    // 超时，算错误
                    stopQuestionTimer();
                    handleTimeout();
                }
            }, 100);
        }

        function stopQuestionTimer() {
            if (questionTimer) {
                clearInterval(questionTimer);
                questionTimer = null;
            }
        }

        function handleTimeout() {
            const current = currentChars[currentIndex];
            wrongCount++;
            wrongWords.push({ char: current.char, pinyin: current.pinyin });
            
            document.getElementById('feedbackArea').innerHTML = 
                `<span class="feedback-wrong">⏰ 超时！正确答案：${current.char} (${current.pinyin})</span>`;
            
            document.getElementById('wrongCount').textContent = wrongCount;
            
            // 禁用所有按钮
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.classList.add('disabled'));
            
            if (wrongCount > 2) {
                setTimeout(() => {
                    endTest();
                }, 2000);
            } else {
                setTimeout(() => {
                    currentIndex++;
                    showQuestion();
                }, 2000);
            }
        }

        // ==================== 结果页 ====================
        function endTest() {
            // 停止计时
            stopQuestionTimer();
            if (totalTimer) {
                clearInterval(totalTimer);
                totalTimer = null;
            }
            
            const elapsed = Math.floor((Date.now() - totalStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            
            const passed = wrongCount <= 2 && currentIndex >= currentChars.length;
            
            // 更新进度
            if (passed && !passedLevels.includes(currentLevel)) {
                passedLevels.push(currentLevel);
                
                // 解锁下一级
                if (currentLevel < 10 && !unlockedLevels.includes(currentLevel + 1)) {
                    unlockedLevels.push(currentLevel + 1);
                }
                
                saveProgress();
            }
            
            // 显示结果
            showPage('result');
            
            document.getElementById('resultCorrect').textContent = correctCount;
            document.getElementById('resultWrong').textContent = wrongCount;
            document.getElementById('resultTime').textContent = `${minutes}:${seconds}`;
            
            const resultIcon = document.getElementById('resultIcon');
            const resultTitle = document.getElementById('resultTitle');
            const nextLevelBtn = document.getElementById('nextLevelBtn');
            
            if (passed) {
                resultIcon.textContent = '🎉';
                resultTitle.textContent = '恭喜过关！';
                nextLevelBtn.style.display = currentLevel < 10 ? 'inline-block' : 'none';
                
                if (currentLevel >= 10) {
                    resultTitle.textContent = '恭喜！你已通关全部级别！';
                }
            } else {
                resultIcon.textContent = '😢';
                resultTitle.textContent = wrongCount > 2 ? '错误超过2个，未通过' : '挑战失败，再接再厉！';
                nextLevelBtn.style.display = 'none';
            }
            
            // 错题回顾
            const wrongWordsArea = document.getElementById('wrongWordsArea');
            const wrongWordsList = document.getElementById('wrongWordsList');
            
            if (wrongWords.length > 0) {
                wrongWordsArea.classList.remove('hidden');
                wrongWordsList.innerHTML = wrongWords.map(w => 
                    `<span class="wrong-word-item">
                        <span class="wrong-word-char">${w.char}</span>
                        <span class="wrong-word-pinyin">${w.pinyin}</span>
                    </span>`
                ).join('');
            } else {
                wrongWordsArea.classList.add('hidden');
            }
        }

        function goToNextLevel() {
            if (currentLevel < 10) {
                startTest(currentLevel + 1);
            }
        }

        function goToNav() {
            showPage('nav');
            renderNavPage();
        }

        function exitTest() {
            if (confirm('确定要退出测试吗？当前进度将不会保存。')) {
                stopQuestionTimer();
                if (totalTimer) {
                    clearInterval(totalTimer);
                    totalTimer = null;
                }
                goToNav();
            }
        }

        // ==================== 工具函数 ====================
        function showPage(page) {
            document.getElementById('navPage').style.display = page === 'nav' ? 'block' : 'none';
            document.getElementById('testPage').style.display = page === 'test' ? 'block' : 'none';
            document.getElementById('resultPage').style.display = page === 'result' ? 'block' : 'none';
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // ==================== 启动 ====================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
